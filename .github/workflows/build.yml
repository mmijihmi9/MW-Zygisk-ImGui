name: Build Modern Warships Zygisk Menu

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Zip Utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Native Library
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-30 \
                ../jni
          make -j$(nproc)

      - name: Package KernelSU Module
        run: |
          # إنشاء مجلد البناء المؤقت
          mkdir -p pkg/zygisk
          
          # نسخ المكتبة البرمجية إلى المسار المخصص للـ Zygisk
          cp build/libzygisk_mw.so pkg/zygisk/arm64-v8a.so

          # نسخ ملفات التوصيف الخارجي للموديول إلى الجذر مباشرة
          if [ -d "module" ]; then
            cp -r module/* pkg/
          fi

          # الضغط من داخل مجلد pkg لضمان تواجد module.prop في الجذر المباشر
          cd pkg
          zip -r ../ModernWarships-Zygisk-Menu.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernWarships-Zygisk-Menu
          path: ModernWarships-Zygisk-Menu.zip
